on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node --test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # the table and one wheel: a broken /ruletti image generator fails here instead of in deploy
      - run: pip install pillow==12.3.0 && python tools/ruletti.py public 0

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # the /ruletti wheel GIFs and table, deployed as the Worker's static assets (env.ASSETS)
      - run: pip install pillow==12.3.0 && python tools/ruletti.py public
      - run: |
          echo "{\"kv_namespaces\":[{\"binding\":\"COINS\",\"id\":\"$COINS_KV_NAMESPACE_ID\"}],\"assets\":{\"directory\":\"public\",\"binding\":\"ASSETS\"}}" > wrangler.json
          npx -y wrangler@4 deploy worker.mjs --name matematiikka-botti --compatibility-date 2026-09-01 --var DISCORD_PUBLIC_KEY:$DISCORD_PUBLIC_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          COINS_KV_NAMESPACE_ID: ${{ secrets.COINS_KV_NAMESPACE_ID }}
      - env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: >-
          curl --fail-with-body -sS -X PUT "https://discord.com/api/v10/applications/$DISCORD_APPLICATION_ID/commands"
          -H "Authorization: Bot $DISCORD_TOKEN" -H "Content-Type: application/json"
          -d @commands.json
