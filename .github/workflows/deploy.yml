on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node --test

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - run: |
          echo "{\"kv_namespaces\":[{\"binding\":\"COINS\",\"id\":\"$COINS_KV_NAMESPACE_ID\"}]}" > wrangler.json
          npx -y wrangler@4 deploy worker.mjs --name matematiikka-botti --compatibility-date 2026-09-01 --var DISCORD_PUBLIC_KEY:$DISCORD_PUBLIC_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          COINS_KV_NAMESPACE_ID: ${{ secrets.COINS_KV_NAMESPACE_ID }}
      - env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: >-
          curl --fail-with-body -sS -X PUT "https://discord.com/api/v10/applications/$DISCORD_APPLICATION_ID/commands"
          -H "Authorization: Bot $DISCORD_TOKEN" -H "Content-Type: application/json"
          -d '[{"name":"roll","description":"Arpoo kokonaisluvun väliltä min–max","integration_types":[0,1],"contexts":[0,1,2],"options":[{"type":4,"name":"max","description":"yläraja","required":true},{"type":4,"name":"min","description":"alaraja, oletus 1"}]},{"name":"makelippo","description":"Laskee laskutoimituksen","integration_types":[0,1],"contexts":[0,1,2],"options":[{"type":3,"name":"laskutoimitus","description":"esim. (2+3)*4^2","required":true,"max_length":200}]},{"name":"goneisii","description":"Pyöritä kolmea hedelmärullaa (3 kolikkoa)","integration_types":[0,1],"contexts":[0,1,2],"options":[{"type":4,"name":"autospin","description":"pyöräytysten määrä, oletus 1","min_value":1,"max_value":8}]},{"name":"gruunavaiglaava","description":"Heitä kolikkoa panoksella","integration_types":[0,1],"contexts":[0,1,2],"options":[{"type":3,"name":"valinta","description":"kruuna vai klaava","required":true,"choices":[{"name":"kruuna","value":"kruuna"},{"name":"klaava","value":"klaava"}]},{"type":4,"name":"panos","description":"panos, oletus 1","min_value":1}]},{"name":"galastus","description":"Kalasta syötillä ja nosta kala oikealla hetkellä","integration_types":[0,1],"contexts":[0,1,2]},{"name":"verkko","description":"Heitä verkko veteen ja nosta se myöhemmin","integration_types":[0,1],"contexts":[0,1,2],"options":[{"type":3,"name":"toiminto","description":"heitä tai nosta","required":true,"choices":[{"name":"heitä","value":"heitä"},{"name":"nosta","value":"nosta"}]},{"type":4,"name":"kesto","description":"aika minuutteina, 1–60","min_value":1,"max_value":60}]},{"name":"kukkaro","description":"Näytä kolikkosaldosi","integration_types":[0,1],"contexts":[0,1,2]},{"name":"leaderboard","description":"Palvelimen rikkaimmat pelaajat","integration_types":[0,1],"contexts":[0]},{"name":"lainaa","description":"Anna kolikoita toiselle pelaajalle","integration_types":[0,1],"contexts":[0],"options":[{"type":6,"name":"kenelle","description":"vastaanottaja","required":true},{"type":4,"name":"määrä","description":"kolikkomäärä","required":true,"min_value":1}]}]'
